name: Proxy Generator

on:
  schedule:
    - cron: '0 0 * * *'  # Every day at 00:00 UTC
  workflow_dispatch:  # Manual trigger

permissions:
  contents: write

jobs:
  generate-proxies:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install sing-box
        run: |
          curl -fsSL https://sing-box.app/gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/sagernet.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/sagernet.gpg] https://deb.sagernet.org/ jammy main" | sudo tee /etc/apt/sources.list.d/sagernet.list
          sudo apt-get update
          sudo apt-get install -y sing-box
          sing-box version

      - name: Install proxyUtil
        run: |
          python -m pip install --upgrade pip
          pip install requests PySocks aiohttp
          pip install git+https://github.com/mheidari98/proxyUtil@main

      - name: Run proxy generator
        run: python elsubs/scripts/check_proxies.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROXY_TEST_WORKERS: '20'
          PROXY_TEST_TIMEOUT: '8'

      - name: Verify outputs
        run: |
          echo "=== Output files ==="
          ls -la elsubs/all elsubs/ss elsubs/vmess elsubs/vless elsubs/trojan
          echo "=== Counts ==="
          wc -l elsubs/all elsubs/ss elsubs/vmess elsubs/vless elsubs/trojan

      - name: Commit and push if changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add elsubs/all elsubs/ss elsubs/vmess elsubs/vless elsubs/trojan elsubs/mheidari98-proxy/.proxy-main/nodes.md || true
          git diff --staged --quiet || git commit -m "Auto-update: generated proxies $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          git push

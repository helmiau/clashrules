name: Proxy Generator

on:
  schedule:
    - cron: '0 0 * * *'  # Every day at 00:00 UTC
  workflow_dispatch:  # Manual trigger

permissions:
  contents: write

jobs:
  generate-proxies:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests PySocks aiohttp
          pip install git+https://github.com/mheidari98/proxyUtil@main

      - name: Install v2rayChecker
        run: |
          wget -q https://github.com/mheidari98/v2rayChecker/releases/latest/download/v2rayChecker_linux_amd64 -O /usr/local/bin/v2rayChecker
          chmod +x /usr/local/bin/v2rayChecker || true

      - name: Run proxy generator
        run: python elsubs/scripts/check_proxies.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify outputs
        run: |
          echo "=== Output files ==="
          ls -la elsubs/all elsubs/ss elsubs/vmess elsubs/vless elsubs/trojan 2>/dev/null || echo "Checking..."
          echo "=== all (first 500 chars) ==="
          head -c 500 elsubs/all 2>/dev/null || echo "all not found"
          echo ""

      - name: Commit and push if changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add elsubs/all elsubs/ss elsubs/vmess elsubs/vless elsubs/trojan elsubs/mheidari98-proxy/.proxy-main/nodes.md || true
          git diff --staged --quiet || git commit -m "Auto-update: generated proxies $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          git push
